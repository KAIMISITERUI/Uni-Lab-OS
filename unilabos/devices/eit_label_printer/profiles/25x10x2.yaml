# 打印机硬件参数
# 通讯层参数 (传输方式 / Windows 打印机名 / WiFi IP 等) 已迁至 config/settings.py,
# 此 YAML 专注标签规格, 不再包含连接信息
printer:
  ppi: 300               # 打印机分辨率(DPI): 常见值 203 或 300

# 纸张参数
paper:
  width: 56            # 纸张总宽度(mm)
  height: 10         # 单个标签高度(mm)
  unit: mm
  columns: 2           # 列数
  column_gap: 3        # 列间距(mm)
  margin: 1.3         # 左右边间距(mm)
  gap: 2          # 连续纸设为0, 有间隙标签纸填实际间距(mm)
  gap_offset: 0       # 间隙偏移(mm)
  direction: 1         # 打印方向: 0或1

# 字体参数 (Windows字体)
# 注意: WiFi 模式 (PIL 渲染) 严格按字体文件查字形, 字体必须包含 CJK 才能打印中文
# 推荐: 微软雅黑 / 宋体 / 黑体 / 楷体 / 仿宋 (均含 CJK + 拉丁字母)
# 若只打 ASCII 字符, 可改为 Arial 等纯英文字体
font:
  name: 微软雅黑        # 字体名称
  size: 60             # 字号上限(dot). 实际字号 = min(此值, 标签高度上限). 仅文字溢出时缩小
  bold: 0              # 粗体: 0=否, 1=是
  underline: 0         # 下划线: 0=否, 1=是
  rotation: 0          # 旋转角度: 0/90/180/270

# 文字打印位置微调 (全局偏移, 单位mm, 正值=向右/向下)
position:
  x: 0.5
  y: 1.5
